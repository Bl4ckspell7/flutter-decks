name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - "v*" # Triggers when a tag starting with 'v' is pushed

jobs:
  build:
    uses: ./.github/workflows/build-core.yaml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/app-release-linux.tar.xz
            artifacts/app-release-macos.zip
            artifacts/app-release.aab
            artifacts/app-release.apk
            artifacts/app-release.exe
            artifacts/app-release.ipa

        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
